name: opspilot-ai

x-api-build: &api-build
  context: ./services/api
  dockerfile: ../../infra/docker/api.Dockerfile

x-api-env: &api-env
  APP_ENV: ${APP_ENV:?set APP_ENV in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_HOST: 0.0.0.0
  API_PORT: 8000
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
  DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-fake}
  AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-deterministic-v1}
  AI_PRIMARY_API_KEY: ${AI_PRIMARY_API_KEY:-}
  AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
  AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
  AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
  AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-30}
  AI_PROVIDER_RETRIES: ${AI_PROVIDER_RETRIES:-2}
  AI_MAX_RUNTIME_SECONDS: ${AI_MAX_RUNTIME_SECONDS:-300}
  AI_MAX_LLM_CALLS: ${AI_MAX_LLM_CALLS:-8}
  AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-14}
  AI_MAX_RETRIES_PER_NODE: ${AI_MAX_RETRIES_PER_NODE:-1}
  AI_MAX_EVIDENCE_ITEMS: ${AI_MAX_EVIDENCE_ITEMS:-50}
  AI_MAX_TOOL_OUTPUT_BYTES: ${AI_MAX_TOOL_OUTPUT_BYTES:-65536}
  AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-50000}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-10000}
  AI_MAX_COST_USD: ${AI_MAX_COST_USD:-2.0}
  AI_MAX_REVISIONS: ${AI_MAX_REVISIONS:-2}
  AI_INPUT_PRICE_PER_MILLION: ${AI_INPUT_PRICE_PER_MILLION:-0}
  AI_OUTPUT_PRICE_PER_MILLION: ${AI_OUTPUT_PRICE_PER_MILLION:-0}
  AI_AUTO_TRIGGER_ENABLED: ${AI_AUTO_TRIGGER_ENABLED:-false}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGGRAPH_STRICT_MSGPACK: "true"
  AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
  AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
  AUTH_OIDC_AUDIENCE: ${AUTH_OIDC_AUDIENCE:-}
  AUTH_OIDC_JWKS_URL: ${AUTH_OIDC_JWKS_URL:-}
  AUTH_OIDC_TOKEN_USE: ${AUTH_OIDC_TOKEN_USE:-access}
  AUTH_LOCAL_SIGNING_KEY: ${AUTH_LOCAL_SIGNING_KEY:-local-dev-only-signing-key-do-not-use-elsewhere}
  AUTH_AUDIT_KEY: ${AUTH_AUDIT_KEY:-local-dev-only-audit-integrity-key-0123456789}
  AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
  REMEDIATION_SANDBOX_PROVIDER: ${REMEDIATION_SANDBOX_PROVIDER:-docker}
  REMEDIATION_SANDBOX_IMAGE: ${REMEDIATION_SANDBOX_IMAGE:-opspilot-sandbox:latest}
  REMEDIATION_MAX_FILES: ${REMEDIATION_MAX_FILES:-5}
  REMEDIATION_MAX_ADDED_LINES: ${REMEDIATION_MAX_ADDED_LINES:-120}
  REMEDIATION_MAX_DELETED_LINES: ${REMEDIATION_MAX_DELETED_LINES:-80}
  REMEDIATION_MAX_PATCH_BYTES: ${REMEDIATION_MAX_PATCH_BYTES:-32768}
  REMEDIATION_MAX_REVISIONS: ${REMEDIATION_MAX_REVISIONS:-3}
  REMEDIATION_APPROVAL_TTL_SECONDS: ${REMEDIATION_APPROVAL_TTL_SECONDS:-3600}
  REMEDIATION_WRITE_PROVIDER: ${REMEDIATION_WRITE_PROVIDER:-fixture}
  REMEDIATION_GITHUB_WRITE_ENABLED: ${REMEDIATION_GITHUB_WRITE_ENABLED:-false}
  REMEDIATION_WRITE_ENABLED_REPOSITORIES: ${REMEDIATION_WRITE_ENABLED_REPOSITORIES:-}
  REMEDIATION_BRANCH_PREFIX: ${REMEDIATION_BRANCH_PREFIX:-opspilot/fix-}
  KNOWLEDGE_STORAGE_BACKEND: local
  KNOWLEDGE_STORAGE_ROOT: /app/data/knowledge
  KNOWLEDGE_MAX_FILE_BYTES: ${KNOWLEDGE_MAX_FILE_BYTES:-5242880}
  KNOWLEDGE_MAX_PDF_PAGES: ${KNOWLEDGE_MAX_PDF_PAGES:-100}
  KNOWLEDGE_MAX_EXTRACTED_CHARS: ${KNOWLEDGE_MAX_EXTRACTED_CHARS:-2000000}
  KNOWLEDGE_CHUNK_TARGET_TOKENS: ${KNOWLEDGE_CHUNK_TARGET_TOKENS:-300}
  KNOWLEDGE_CHUNK_OVERLAP_TOKENS: ${KNOWLEDGE_CHUNK_OVERLAP_TOKENS:-40}
  KNOWLEDGE_CHUNK_MIN_TOKENS: ${KNOWLEDGE_CHUNK_MIN_TOKENS:-20}
  KNOWLEDGE_CHUNK_MAX_TOKENS: ${KNOWLEDGE_CHUNK_MAX_TOKENS:-500}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-bow-v1}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-64}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  EMBEDDING_RETRIES: ${EMBEDDING_RETRIES:-2}
  EMBEDDING_MAX_TOKENS_PER_JOB: ${EMBEDDING_MAX_TOKENS_PER_JOB:-200000}
  KNOWLEDGE_MAX_QUERY_LENGTH: ${KNOWLEDGE_MAX_QUERY_LENGTH:-1000}
  KNOWLEDGE_MAX_CANDIDATES: ${KNOWLEDGE_MAX_CANDIDATES:-50}
  KNOWLEDGE_MAX_TOP_K: ${KNOWLEDGE_MAX_TOP_K:-20}
  KNOWLEDGE_MIN_RELEVANCE: ${KNOWLEDGE_MIN_RELEVANCE:-0.01}
  KNOWLEDGE_MIN_VECTOR_RELEVANCE: ${KNOWLEDGE_MIN_VECTOR_RELEVANCE:-0.30}
  KNOWLEDGE_MIN_RERANK_RELEVANCE: ${KNOWLEDGE_MIN_RERANK_RELEVANCE:-0.10}
  RERANK_PROVIDER: ${RERANK_PROVIDER:-fake}
  RERANK_MODEL: ${RERANK_MODEL:-token-overlap-v1}
  RERANK_API_KEY: ${RERANK_API_KEY:-}
  RERANK_CANDIDATE_LIMIT: ${RERANK_CANDIDATE_LIMIT:-20}
  KNOWLEDGE_EXPERIMENTAL_QUERY_ENHANCEMENT: ${KNOWLEDGE_EXPERIMENTAL_QUERY_ENHANCEMENT:-false}
  EVENT_BUS_BACKEND: ${EVENT_BUS_BACKEND:-kafka}
  KAFKA_BOOTSTRAP_SERVERS: broker:9092
  KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-opspilot.observability}
  KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
  KAFKA_PRODUCE_TIMEOUT_SECONDS: ${KAFKA_PRODUCE_TIMEOUT_SECONDS:-5}
  OBS_SECRET_ENCRYPTION_KEY: ${OBS_SECRET_ENCRYPTION_KEY:-}
  OBS_WEBHOOK_MAX_BYTES: ${OBS_WEBHOOK_MAX_BYTES:-262144}
  OBS_WEBHOOK_REPLAY_WINDOW_SECONDS: ${OBS_WEBHOOK_REPLAY_WINDOW_SECONDS:-300}
  OBS_WORKSPACE_RATE_PER_SECOND: ${OBS_WORKSPACE_RATE_PER_SECOND:-200}
  OBS_SOURCE_RATE_PER_SECOND: ${OBS_SOURCE_RATE_PER_SECOND:-100}
  OBS_LAG_THRESHOLD: ${OBS_LAG_THRESHOLD:-5000}
  OBS_DEAD_LETTER_RATE_THRESHOLD: ${OBS_DEAD_LETTER_RATE_THRESHOLD:-50}
  OBS_RETRY_MAX_ATTEMPTS: ${OBS_RETRY_MAX_ATTEMPTS:-5}
  OBS_RETRY_MAX_AGE_SECONDS: ${OBS_RETRY_MAX_AGE_SECONDS:-900}
  OBS_RETRY_BASE_DELAY_SECONDS: ${OBS_RETRY_BASE_DELAY_SECONDS:-0.5}
  OBS_DEDUP_WINDOW_SECONDS: ${OBS_DEDUP_WINDOW_SECONDS:-300}
  GITHUB_PROVIDER: ${GITHUB_PROVIDER:-fixture}
  GITHUB_FIXTURE_REBASE_TO_NOW: ${GITHUB_FIXTURE_REBASE_TO_NOW:-false}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
  GITHUB_ALLOWED_INSTALLATION_IDS: ${GITHUB_ALLOWED_INSTALLATION_IDS:-}
  GITHUB_WEBHOOK_MAX_BYTES: ${GITHUB_WEBHOOK_MAX_BYTES:-1048576}
  REPO_MAX_FILES: ${REPO_MAX_FILES:-2000}
  REPO_MAX_FILE_BYTES: ${REPO_MAX_FILE_BYTES:-262144}
  REPO_MAX_TOTAL_BYTES: ${REPO_MAX_TOTAL_BYTES:-20971520}
  REPO_MAX_CHUNKS: ${REPO_MAX_CHUNKS:-5000}
  REPO_INDEX_TIMEOUT_SECONDS: ${REPO_INDEX_TIMEOUT_SECONDS:-300}
  REPO_CHUNK_MAX_LINES: ${REPO_CHUNK_MAX_LINES:-80}
  REPO_CHUNK_OVERLAP_LINES: ${REPO_CHUNK_OVERLAP_LINES:-5}
  REPO_MAX_PARSE_FAILURE_RATIO: ${REPO_MAX_PARSE_FAILURE_RATIO:-0.5}
  REPO_MAX_COMMITS_PER_SYNC: ${REPO_MAX_COMMITS_PER_SYNC:-100}
  REPO_CORRELATION_LOOKBACK_HOURS: ${REPO_CORRELATION_LOOKBACK_HOURS:-72}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5450}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6390}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: *api-build
    image: opspilot-api:dev
    command: ["uvicorn", "opspilot_api.asgi:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment: *api-env
    volumes:
      - knowledge_data:/app/data/knowledge
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8300}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: *api-build
    image: opspilot-api:dev
    command: ["python", "-m", "opspilot_api.worker.main"]
    environment: *api-env
    volumes:
      - knowledge_data:/app/data/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "opspilot_api.worker.healthcheck"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 15s
    restart: unless-stopped

  broker:
    # Kafka-compatible single-node broker (Redpanda, no ZooKeeper). The external listener exists
    # only for host-run tests/benchmarks and is bound to loopback.
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://broker:9092,external://127.0.0.1:${KAFKA_HOST_PORT:-19092}
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092"
    volumes:
      - broker_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  broker-init:
    # One-shot, idempotent topic bootstrap.
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for t in raw normalized dead-letter; do
        rpk topic create ${KAFKA_TOPIC_PREFIX:-opspilot.observability}.$$t.v1 -p 3 -r 1 -X brokers=broker:9092 || true;
        done
    depends_on:
      broker:
        condition: service_healthy
    restart: "no"

  raw-consumer:
    build: *api-build
    image: opspilot-api:dev
    command: ["python", "-m", "opspilot_api.observability.consumer", "--role", "raw"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9108/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    restart: unless-stopped

  normalized-consumer:
    build: *api-build
    image: opspilot-api:dev
    command: ["python", "-m", "opspilot_api.observability.consumer", "--role", "normalized"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9109/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL in .env}
    image: opspilot-web:dev
    environment:
      # Server-side only (never exposed to the browser): sealed-session secret and OIDC settings.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (at least 32 characters)}
      AUTH_MODE: ${AUTH_MODE:-local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3300}
      API_INTERNAL_URL: http://api:8000
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-opspilot-web}
      OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:-http://localhost:8300/api/v1/auth/local/authorize}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-http://api:8000/api/v1/auth/local/token}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      AUTH_LOCAL_SIGNING_KEY: ${AUTH_LOCAL_SIGNING_KEY:-local-dev-only-signing-key-do-not-use-elsewhere}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3300}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Optional local OpenID Connect provider for exercising the real (non-local) login flow.
  # Start with: docker compose --profile idp up -d keycloak  (see README "Local OIDC with Keycloak").
  keycloak:
    profiles: ["idp"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-local-only}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./infra/keycloak/opspilot-realm.json:/opt/keycloak/data/import/opspilot-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    restart: unless-stopped

volumes:
  broker_data:
  postgres_data:
  redis_data:
  knowledge_data:
