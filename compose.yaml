name: opspilot-ai

x-api-build: &api-build
  context: ./services/api
  dockerfile: ../../infra/docker/api.Dockerfile

x-api-env: &api-env
  APP_ENV: ${APP_ENV:?set APP_ENV in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_HOST: 0.0.0.0
  API_PORT: 8000
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
  DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
  AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-15}
  AUTH_REFRESH_TOKEN_DAYS: ${AUTH_REFRESH_TOKEN_DAYS:-7}
  AUTH_SIGNUP_ENABLED: ${AUTH_SIGNUP_ENABLED:-false}
  AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-10}
  AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
  INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-600}
  AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-fake}
  AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-deterministic-v1}
  AI_PRIMARY_API_KEY: ${AI_PRIMARY_API_KEY:-}
  AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
  AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
  AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
  AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-30}
  AI_PROVIDER_RETRIES: ${AI_PROVIDER_RETRIES:-2}
  AI_MAX_RUNTIME_SECONDS: ${AI_MAX_RUNTIME_SECONDS:-300}
  AI_MAX_LLM_CALLS: ${AI_MAX_LLM_CALLS:-8}
  AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-8}
  AI_MAX_RETRIES_PER_NODE: ${AI_MAX_RETRIES_PER_NODE:-1}
  AI_MAX_EVIDENCE_ITEMS: ${AI_MAX_EVIDENCE_ITEMS:-50}
  AI_MAX_TOOL_OUTPUT_BYTES: ${AI_MAX_TOOL_OUTPUT_BYTES:-65536}
  AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-50000}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-10000}
  AI_MAX_COST_USD: ${AI_MAX_COST_USD:-2.0}
  AI_MAX_REVISIONS: ${AI_MAX_REVISIONS:-2}
  AI_INPUT_PRICE_PER_MILLION: ${AI_INPUT_PRICE_PER_MILLION:-0}
  AI_OUTPUT_PRICE_PER_MILLION: ${AI_OUTPUT_PRICE_PER_MILLION:-0}
  AI_AUTO_TRIGGER_ENABLED: ${AI_AUTO_TRIGGER_ENABLED:-false}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGGRAPH_STRICT_MSGPACK: "true"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5450}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6390}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: *api-build
    image: opspilot-api:dev
    command: ["uvicorn", "opspilot_api.asgi:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment: *api-env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8300}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: *api-build
    image: opspilot-api:dev
    command: ["python", "-m", "opspilot_api.worker.main"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "opspilot_api.worker.healthcheck"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL in .env}
    image: opspilot-web:dev
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3300}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
