name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Public, non-secret build-time value.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8300
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend (ruff, mypy, pytest, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: opspilot_ci
          POSTGRES_USER: opspilot_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot_ci -d opspilot_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values for ephemeral CI service containers; not real secrets.
      APP_ENV: test
      CORS_ORIGINS: http://localhost:3300
      POSTGRES_DB: opspilot_ci
      POSTGRES_USER: opspilot_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Apply Alembic migrations
        run: uv run alembic upgrade head
      - name: Validate migration downgrade and re-upgrade
        run: uv run alembic downgrade 0001 && uv run alembic upgrade head
      - name: Integration tests (live PostgreSQL + Redis)
        run: uv run pytest -m integration

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
