name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Public, non-secret build-time value.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8300
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend (ruff, mypy, pytest, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: opspilot_ci
          POSTGRES_USER: opspilot_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot_ci -d opspilot_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values for ephemeral CI service containers; not real secrets.
      APP_ENV: test
      CORS_ORIGINS: http://localhost:3300
      POSTGRES_DB: opspilot_ci
      POSTGRES_USER: opspilot_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      AI_PRIMARY_PROVIDER: fake
      AI_PRIMARY_MODEL: deterministic-v1
      LANGGRAPH_STRICT_MSGPACK: "true"
      KNOWLEDGE_STORAGE_ROOT: /tmp/opspilot-knowledge
      EMBEDDING_PROVIDER: fake
      EMBEDDING_MODEL: hash-bow-v1
      EMBEDDING_DIMENSIONS: "64"
      RERANK_PROVIDER: fake
      GITHUB_PROVIDER: fixture
      # Module 6: fake model, fixture GitHub provider/writer, no real GitHub writes or paid APIs.
      REMEDIATION_WRITE_PROVIDER: fixture
      # Module 7: deterministic local identity provider; no Cognito/AWS/email in CI.
      AUTH_PROVIDER: local
      REMEDIATION_GITHUB_WRITE_ENABLED: "false"
      EVENT_BUS_BACKEND: kafka
      KAFKA_BOOTSTRAP_SERVERS: "127.0.0.1:19092"
      REQUIRE_KAFKA: "1"
      # Throwaway Fernet key for ephemeral CI containers; not a real secret.
      OBS_SECRET_ENCRYPTION_KEY: mzn9nB8mYQ4Qd1yq0Z3sT0w6mYJm5J7B7xk3T4p8o9U=
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # Coverage floor for the unit suite (60% when it was set); the integration steps below add
      # more but are not counted. Raise the floor as coverage grows, never lower it to pass.
      - run: uv run pytest --cov=opspilot_api --cov-report=term --cov-fail-under=58
      - name: Start Kafka-compatible broker (Redpanda)
        run: |
          docker run -d --name broker -p 127.0.0.1:19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v24.2.7 redpanda start \
            --mode=dev-container --smp=1 --memory=512M --reserve-memory=0M \
            --overprovisioned --node-id=0 --check=false \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://127.0.0.1:9092,external://127.0.0.1:19092
          for attempt in $(seq 1 60); do
            if docker exec broker rpk cluster health | grep -qE 'Healthy:.+true'; then exit 0; fi
            sleep 2
          done
          docker logs broker
          exit 1
      - name: Apply Alembic migrations
        run: uv run alembic upgrade head
      - name: Set up durable LangGraph checkpoints
        run: uv run python -m opspilot_api.investigations.checkpoint_setup
      - name: Validate migration downgrade and re-upgrade
        run: uv run alembic downgrade 0001 && uv run alembic upgrade head
      - name: Build the verification sandbox image (Module 6)
        run: docker build -f ../../infra/docker/sandbox.Dockerfile -t opspilot-sandbox:latest ../../infra/docker
      - name: Integration tests (live PostgreSQL, Redis, Kafka-compatible broker, Docker sandbox)
        run: uv run pytest -m integration
      - name: Authentication, RBAC, and tenant-isolation regression suite
        run: uv run pytest -m integration tests/test_auth_integration.py tests/test_remediation_integration.py -q
      - name: Verify audit-log integrity
        run: uv run python -m opspilot_api.auth.audit_verify
      - name: LLMOps golden evaluation (fake provider, 3 repeats, gates, JSON and Markdown reports)
        run: >-
          uv run python -m opspilot_api.llmops.cli ci
          --baseline tests/fixtures/llmops_baseline.json --out evaluation-reports
      - name: LLMOps negative control (a regressing variant MUST be blocked by the gates)
        run: |
          if uv run python -m opspilot_api.llmops.cli ci --variant regressing --baseline tests/fixtures/llmops_baseline.json --out evaluation-reports; then
            echo "regressing variant passed the gates: the quality gates are broken"
            exit 1
          fi
      - name: LLMOps candidate-versus-control comparison
        run: uv run python -m opspilot_api.llmops.cli compare --out evaluation-reports
      - name: Upload LLMOps evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llmops-evaluation-reports
          path: services/api/evaluation-reports/
          if-no-files-found: ignore
      - name: Deterministic remediation fixture evaluation (fake model, local providers, Docker sandbox)
        run: >-
          uv run python -m opspilot_api.remediation.evaluation
          --dataset tests/fixtures/remediation_evaluation.json
          --sandbox docker --output remediation-evaluation.json
      - name: Deterministic retrieval evaluation
        run: >-
          uv run python -m opspilot_api.knowledge.evaluation
          --dataset tests/fixtures/retrieval_evaluation.json
          --json-output retrieval-evaluation.json
          --markdown-output retrieval-evaluation.md
      - name: Deterministic pipeline smoke test
        run: uv run python -m opspilot_api.observability.smoke
      - name: Deterministic code-search and change-correlation evaluation
        run: >-
          uv run python -m opspilot_api.repositories.evaluation
          --dataset tests/fixtures/repository_evaluation.json
          --json-output repository-evaluation.json
          --markdown-output repository-evaluation.md

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example config --quiet
