version: 2

# Weekly update PRs. Minor and patch updates are grouped to keep review load low; majors arrive
# individually. Every update goes through the same CI and Security workflows as any other change.
updates:
  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      node-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    ignore:
      # Runtime base images move deliberately, not by bot. The backend declares
      # requires-python ">=3.12,<3.13", so newer Python images would not run it; Node major
      # bumps (24 -> 25 is a non-LTS release) are chosen manually. Patch updates still arrive
      # through the base image tag itself and the weekly Trivy scan.
      - dependency-name: python
        versions: [">=3.13"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
