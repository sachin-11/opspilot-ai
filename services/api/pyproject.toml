[project]
name = "opspilot-api"
version = "0.1.0"
description = "OpsPilot AI backend: FastAPI API and RQ worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.122",
    "confluent-kafka>=2.16.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rq>=3.0.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot_api"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
    "types-reportlab>=5.0.0.20261008",
]


[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Long literal payloads/assertions in the observability scenario tests stay readable inline.
"tests/test_observability_*.py" = ["E501", "S101", "S105", "S106"]
# Remediation tests embed long diff/probe literals and drive the Docker CLI directly.
"tests/test_remediation_*.py" = ["E501", "S101", "S105", "S106", "S108", "S603", "S607"]
"tests/remediation_helpers.py" = ["E501", "S101"]
"tests/test_auth_*.py" = ["E501", "S101", "S105", "S106", "S608", "SIM117"]
# Autogenerated schema migration with long constraint expressions.
"migrations/versions/0007_remediation.py" = ["E501", "S608"]
"migrations/versions/0008_*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rq.*", "boto3.*", "botocore.*", "confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs live PostgreSQL and Redis (run after `alembic upgrade head`)",
]
filterwarnings = ["error"]
